<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>멸천문파 | 경단 만들기 미니게임</title>
<style>
:root{--bg:#090d18;--panel:#121a2b;--panel2:#1a2438;--gold:#d7b66a;--muted:#9aa6ba;--ink:#f3eee3;--line:#35415a;--paper:#e6d7b5;--purple:#8f79bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#202d48 0,#090d18 65%);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.hero{padding:26px 20px 18px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1c2944,#111729 60%,#31233b);border-bottom:1px solid #66563c}.hero:after{content:'☾';position:absolute;right:18px;top:8px;font-size:90px;color:#e6c979;opacity:.12}.eyebrow{letter-spacing:.24em;font-size:11px;color:var(--gold)}h1{margin:5px 0;font-size:32px;letter-spacing:.08em} .sub{color:#c2c9d8;font-size:13px}.crest{display:inline-grid;place-items:center;width:48px;height:48px;border:1px solid var(--gold);border-radius:50%;color:var(--gold);margin-right:12px;font-size:23px}.brand{display:flex;align-items:center}.section{padding:16px}.card{background:linear-gradient(145deg,#182238,#111827);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 10px 30px #0003}.paper{background:linear-gradient(145deg,#dfd0ad,#c8b48e);color:#282116;border-color:#ad9264}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:17px}.card h3{font-size:14px}.muted{color:var(--muted)}.paper .muted{color:#67573e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px;border-radius:12px;background:#0c1423;border:1px solid #33415b}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:20px;margin-top:5px;color:var(--gold)}.btn{border:1px solid #726044;background:#302a21;color:#f5e5bd;border-radius:12px;padding:10px 13px;font:inherit;cursor:pointer}.btn.primary{background:var(--gold);color:#1b1720;border-color:var(--gold);font-weight:700}.btn.ghost{background:#131d30;border-color:var(--line);color:var(--ink)}.btn:active{transform:scale(.98)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{min-height:75px;display:grid;gap:4px;place-items:center}.quick span{font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 12px}.tabs button{white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);background:#080d17eF;backdrop-filter:blur(12px);border-top:1px solid #303c52;padding:8px 5px env(safe-area-inset-bottom,8px);z-index:10}.nav button{border:0;background:none;color:#91a0b6;font:inherit;font-size:11px;padding:7px 2px;cursor:pointer}.nav button b{display:block;font-size:20px;margin-bottom:3px}.nav button.active{color:var(--gold)}.view{display:none}.view.active{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#0d1525;border:1px solid #293650}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c6b9e,#2c3956);border:1px solid var(--gold);font-size:17px}.item .meta{flex:1}.item small{color:var(--muted)}input,textarea,select{background:#0c1423;border:1px solid #35415a;border-radius:9px;color:var(--ink);padding:10px;font:inherit;width:100%}textarea{min-height:75px}.formrow{display:flex;gap:8px}.formrow>*{flex:1}.badge{font-size:11px;color:var(--gold);border:1px solid #78633e;border-radius:20px;padding:3px 8px}.notice{border-left:3px solid var(--gold);padding-left:12px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{aspect-ratio:1;border-radius:13px;background:linear-gradient(135deg,#293b5b,#6a567e);display:grid;place-items:center;font-size:30px;border:1px solid #58627b}.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center}.footnote{font-size:11px;color:var(--muted);padding:14px;text-align:center}.pill{border-radius:30px}.schedule{display:flex;gap:12px;align-items:center}.schedule .date{padding:10px;background:#0b1321;border-radius:10px;color:var(--gold);text-align:center;min-width:70px}.hidden{display:none}@media(min-width:650px){.hero{padding:32px}.section{padding:20px}.quick{grid-template-columns:repeat(5,1fr)}}
.game-board{position:relative;height:440px;max-width:360px;margin:auto;background:linear-gradient(#182541,#0c1424);border:2px solid #78633e;border-radius:14px;overflow:hidden;touch-action:none}.ball{position:absolute;border-radius:50%;display:grid;place-items:center;border:2px solid #ffffff65;box-shadow:inset -5px -7px 12px #0005,0 4px 8px #0005;user-select:none}.game-hint{text-align:center;color:var(--muted);font-size:12px}.overlay{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:16px}.overlay.hidden{display:none}.dialog{width:min(100%,400px);background:#141e32;border:1px solid var(--gold);border-radius:16px;padding:20px}.dialog h2{margin-top:0}.danger{border-color:#b96363;color:#ffbaba}.game-board:focus{outline:2px solid var(--gold)}

.app{padding-bottom:20px}.game-board{width:100%}.hero{padding:22px 20px}.section{padding-top:10px}.formrow input{min-width:0}@media(max-width:390px){.formrow{flex-wrap:wrap}.formrow>*{flex:1 1 100%}}
</style></head><body><div class="app">
<header class="hero"><div class="brand"><div class="crest">滅</div><div><div class="eyebrow">THE MUNPA · MELCHEON</div><h1>멸천 문파</h1><div class="sub">하늘을 넘어, 함께 나아가다</div></div></div></header>
<main>

<section class="section" id="game"><div class="card"><h2>🍡 멸천 경단 만들기</h2><div class="formrow"><input id="gameNickname" maxlength="16" placeholder="문파원 닉네임"/><button class="btn primary" onclick="startGame()">게임 시작</button></div><p class="muted" style="font-size:12px">같은 경단이 만나면 합쳐집니다. 터치 또는 마우스로 위치를 정하고 놓으세요.</p><div class="stats" style="margin:12px 0"><div class="stat"><label>현재 점수</label><strong id="gameScore">0</strong></div><div class="stat"><label>최고 점수</label><strong id="gameBest">0</strong></div><div class="stat"><label>다음 경단</label><strong id="gameNext">🍡</strong></div></div><div aria-label="경단 게임판" class="game-board" id="gameBoard" tabindex="0"></div><div class="game-hint">게임 시작 후 보드를 클릭하거나 터치해서 경단을 떨어뜨리세요.</div><button class="btn ghost" onclick="endGame()" style="width:100%;margin-top:12px">게임 종료 · 점수 저장</button></div><div class="card"><div class="row"><h2>🏆 멸천문파 전용 랭킹</h2><button class="btn ghost" onclick="loadRanking()">새로고침</button></div><div class="muted" id="rankStatus" style="font-size:12px"></div><div class="list" id="rankingList" style="margin:12px 0"></div><button class="btn danger" onclick="openResetDialog()">🔒 랭킹 전체 초기화</button></div></section>




</main><div class="footnote">멸천문파 · 경단 만들기 미니게임</div>
</div><div aria-labelledby="resetTitle" aria-modal="true" class="overlay hidden" id="resetOverlay" role="dialog"><div class="dialog"><h2 id="resetTitle">🔒 관리자 비밀번호 인증</h2><div id="resetStepPassword"><p class="muted">랭킹을 초기화하려면 관리자 비밀번호를 입력하세요.</p><input autocomplete="off" id="resetPassword" placeholder="관리자 비밀번호" type="password"/><p id="resetError" role="alert" style="color:#ffaaaa"></p><div class="formrow"><button class="btn ghost" onclick="closeResetDialog()">취소</button><button class="btn primary" onclick="verifyResetPassword()">비밀번호 확인</button></div></div><div class="hidden" id="resetStepConfirm"><p>정말로 멸천문파 전체 랭킹을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p><div class="formrow"><button class="btn ghost" onclick="closeResetDialog()">취소</button><button class="btn danger" onclick="confirmRankingReset()">전체 초기화 실행</button></div></div></div></div>
<script defer="" src="game.js"></script></body></html>
